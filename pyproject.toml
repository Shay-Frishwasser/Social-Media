[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "brandai"
version = "0.2.0"
description = "Local-first BrandAI storage and brand-memory foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17,<2",
  "beautifulsoup4>=4.13,<5",
  "ddgs>=9,<10",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pillow>=12,<14",
  "playwright>=1.55,<2",
  "psutil>=7,<8",
  "PySocks>=1.7,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "sentence-transformers>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "trafilatura>=2.0,<3",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=9,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brandai = ["alembic/**/*.py", "alembic/**/script.py.mako"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

